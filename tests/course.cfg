% Exercises TeX spaces, nested values, repeated declarations, and deferred APIs.
\technicasetup{
    layout=true,
    headings=false,
    theme=dark,
    codeopts={languages={cpp,sh},arc=7pt,left=11pt},
    boxopts={leftrule=5pt},
    macroopts={sets=prose,keypadding=2pt},
    layoutopts={parskip={9pt plus 3pt minus 1pt}}
}
\technicasetup{codeopts={right=13pt}}
\technicaaftersetup{
    \technicadefinecallout{designrule}{Design rule}{TechnicaExplanation}
    \technicadefineinlinemacro{configkey}
    \newcommand{\configphrase}{Spaces are preserved}
}
\technicaaftersetup{\newcommand{\configsecond}{Second hook}}
